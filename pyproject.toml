[project]
name = "imessage-edge"
version = "0.4.0"
description = "Mac-side HTTP daemon exposing iMessage send/read to a remote orchestrator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.0.0",
]

[project.scripts]
imessage-edge = "imessage_edge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imessage_edge"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "PLC0415"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
